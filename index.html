app.get("/", (req, res) => {
  res.send(`
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>System SOR</title>
<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  margin: 0;
  padding: 0;
}

.header {
  position: fixed;
  top: 15px;
  right: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  margin-top: 120px;
  text-align: center;
}

input {
  padding: 10px;
  width: 220px;
  font-size: 16px;
}

button {
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 20px;
}

li {
  background: white;
  margin: 8px auto;
  padding: 10px;
  width: 300px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">System SOR</div>

<div class="container">
  <input id="o" placeholder="رقم الطلب">
  <button onclick="load()">بحث</button>
  <ul id="l"></ul>
</div>

<script>
async function load(){
  const r = await fetch('/order/' + o.value);
  const d = await r.json();
  l.innerHTML = '';
  d.forEach(x=>{
    const li=document.createElement('li');
    li.textContent=x.item_name;
    li.onclick=()=>{
      const i=document.createElement('input');
      i.value=x.item_name;
      li.replaceWith(i);
      i.focus();
      i.onkeydown=async e=>{
        if(e.key==='Enter'){
          await fetch('/item/'+x.id,{
            method:'PUT',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:i.value})
          });
          li.textContent=i.value;
          i.replaceWith(li);
        }
      }
    }
    l.appendChild(li);
  });
}
</script>

</body>
</html>
`);
});
